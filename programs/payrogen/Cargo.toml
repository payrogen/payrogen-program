[package]
name = "payrogen"
version = "0.2.0"
description = "PayRogen Payment Gateway Smart Contract"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "payrogen"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"

[dev-dependencies]
proptest = "1.4"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
] }
