[package]
name = "payrogen-litesvm-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false
description = "Black-box LiteSVM integration tests for the PayRogen Solana program (loads target/deploy/payrogen.so)"

# Standalone workspace with its own Cargo.lock so test-only dependencies never
# change the program's locked dependency graph.
[workspace]
resolver = "3"  # MSRV-aware: pick dependency versions that support rust-version

[dependencies]

[dev-dependencies]
# Versions are bounded by litesvm 0.16 (the newest release whose runtime
# supports rustc 1.96). Cargo.lock pins the exact resolved versions.
litesvm = "=0.16.0"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-message = "4"
solana-instruction = "3"
solana-address = "2"
solana-account = "4"
solana-clock = "3"
sha2 = "0.10"
