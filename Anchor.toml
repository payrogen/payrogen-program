[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.devnet]
payrogen = "AeJVPDMxcSvn89F5kgiita5cndcQvamEnCSvY38HeYFg"

[programs.localnet]
payrogen = "AeJVPDMxcSvn89F5kgiita5cndcQvamEnCSvY38HeYFg"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Offline LiteSVM suite against target/deploy/payrogen.so (run `anchor build` first).
# Use `anchor run test`. Do NOT use `anchor test` with the devnet provider: it deploys.
test = "cargo test --manifest-path programs/payrogen/Cargo.toml && cargo test --manifest-path tests-litesvm/Cargo.toml"

[hooks]
